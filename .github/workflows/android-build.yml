name: Build APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download EDL assets
        run: |
          mkdir -p edl_flash_app/src/main
          curl -L --fail \
            -o edl_assets.tar.gz \
            https://github.com/wuyifeiwu4-dot/EdlFlash/releases/download/v1.0-assets/edl_assets.tar.gz
          tar -xzf edl_assets.tar.gz
          mv assets edl_flash_app/src/main/assets
          echo "EDL assets installed"
          ls -la edl_flash_app/src/main/assets

      # ========== 自动修复所有子目录的 ELF 缺失（通杀所有机型） ==========
      - name: Force fix missing ELF path (all subdirs)
        run: |
          ASSETS_DIR="edl_flash_app/src/main/assets"
          LOADER_DIR="$ASSETS_DIR/loader_builtin"

          # 查找任意 DevprgProgrammer*.elf（支持 .elf、1.elf、2.elf 等）
          ELF=$(find "$ASSETS_DIR" -type f -name "DevprgProgrammer*.elf" | head -n 1)
          if [ -z "$ELF" ]; then
            echo "ERROR: No DevprgProgrammer*.elf found in assets!"
            exit 1
          fi
          echo "Found ELF at: $ELF"

          # 确保 loader_builtin 目录存在
          mkdir -p "$LOADER_DIR"

          # 1. 递归遍历 loader_builtin 下的所有子目录（包括多级）
          find "$LOADER_DIR" -type d | while read -r dir; do
            # 对每个目录复制三种命名
            for name in DevprgProgrammer.elf DevprgProgrammer1.elf DevprgProgrammer2.elf; do
              cp "$ELF" "$dir/$name" 2>/dev/null || true
            done
          done

          # 2. 也复制到 loader_builtin 根目录（以防 Gradle 直接找根）
          for name in DevprgProgrammer.elf DevprgProgrammer1.elf DevprgProgrammer2.elf; do
            cp "$ELF" "$LOADER_DIR/$name" 2>/dev/null || true
          done

          echo "✅ ELF deployed to all subdirectories (including all brands/models) with multiple names."

          # 验证：列出 loader_builtin 下所有子目录的内容（简要）
          echo "===== Verifying some directories ====="
          find "$LOADER_DIR" -type f -name "DevprgProgrammer*.elf" | head -10

      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: EdlFlash-release
          path: android/app/build/outputs/apk/release/*.apk
