name: Build APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download EDL assets
        run: |
          mkdir -p edl_flash_app/src/main
          curl -L --fail \
            -o edl_assets.tar.gz \
            https://github.com/wuyifeiwu4-dot/EdlFlash/releases/download/v1.0-assets/edl_assets.tar.gz
          tar -xzf edl_assets.tar.gz
          mv assets edl_flash_app/src/main/assets
          echo "EDL assets installed"
          ls -la edl_flash_app/src/main/assets

      - name: Ensure ELF variants exist
        run: |
          set -e
          ASSETS_DIR="edl_flash_app/src/main/assets"
          LOADER_DIR="$ASSETS_DIR/loader_builtin"

          # 找到任意 DevprgProgrammer*.elf
          ELF=$(find "$ASSETS_DIR" -type f -name "DevprgProgrammer*.elf" -print -quit)
          if [ -z "$ELF" ]; then
            echo "❌ No DevprgProgrammer*.elf found"
            exit 1
          fi
          echo "✅ Found ELF: $ELF"

          # 找到包含 16XS 的目录
          TARGET_DIR=$(find "$LOADER_DIR" -type d -name "*16XS*" -print -quit)
          if [ -z "$TARGET_DIR" ]; then
            echo "❌ 16XS directory not found"
            find "$LOADER_DIR" -type d
            exit 1
          fi
          echo "✅ Target: $TARGET_DIR"

          # 复制所有命名（但跳过自身）
          for suffix in "" "1" "2"; do
            target="$TARGET_DIR/DevprgProgrammer${suffix}.elf"
            if [ -f "$target" ]; then
              echo "ℹ️  Already exists: $target"
            else
              cp -v "$ELF" "$target"
            fi
          done

          # 额外复制到所有子目录（只补充缺失）
          find "$LOADER_DIR" -type d | while read -r dir; do
            for suffix in "" "1" "2"; do
              target="$dir/DevprgProgrammer${suffix}.elf"
              if [ ! -f "$target" ]; then
                cp "$ELF" "$target" 2>/dev/null || true
              fi
            done
          done

          echo "✅ ELF variants ensured."

      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: EdlFlash-release
          path: android/app/build/outputs/apk/release/*.apk
