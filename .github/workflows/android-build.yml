name: Build APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download EDL assets
        run: |
          mkdir -p edl_flash_app/src/main
          curl -L --fail \
            -o edl_assets.tar.gz \
            https://github.com/wuyifeiwu4-dot/EdlFlash/releases/download/v1.0-assets/edl_assets.tar.gz
          tar -xzf edl_assets.tar.gz
          mv assets edl_flash_app/src/main/assets
          echo "EDL assets installed"
          ls -la edl_flash_app/src/main/assets

      # 列出所有文件（包含乱码真实名称）
      - name: Dump full asset tree
        run: |
          echo "===== Full asset tree (with escape codes) ====="
          find edl_flash_app/src/main/assets -type f -exec ls -la {} \; | cat -v

      # 强制修复：直接基于 find 的输出进行复制
      - name: Force fix ELF path by real name
        run: |
          ASSETS_DIR="edl_flash_app/src/main/assets"
          LOADER_DIR="$ASSETS_DIR/loader_builtin"

          # 1. 找到真实的 DevprgProgrammer*.elf 文件路径
          ELF=$(find "$ASSETS_DIR" -name "DevprgProgrammer*.elf" -print -quit)
          if [ -z "$ELF" ]; then
            echo "ERROR: No DevprgProgrammer*.elf found!"
            # 显示所有 elf 文件
            find "$ASSETS_DIR" -name "*.elf"
            exit 1
          fi
          echo "Found ELF: $ELF"

          # 2. 列出 loader_builtin 下的所有子目录（真实名称）
          echo "===== Subdirectories under loader_builtin ====="
          find "$LOADER_DIR" -mindepth 1 -maxdepth 1 -type d -print0 | while IFS= read -r -d '' dir; do
            echo "Dir: $dir"
          done

          # 3. 直接创建目标目录，使用 ASCII 转义序列确保字符正确
          # 注意：这里我们直接用十六进制或 Unicode 转义，但 shell 直接输入即可。
          TARGET_DIR="$LOADER_DIR/ڡ���_MEIZU/ڡ���16XS"
          mkdir -p "$TARGET_DIR"
          echo "Created target: $TARGET_DIR"

          # 4. 复制并重命名为 DevprgProgrammer.elf
          cp "$ELF" "$TARGET_DIR/DevprgProgrammer.elf"
          if [ -f "$TARGET_DIR/DevprgProgrammer.elf" ]; then
            echo "✅ Copied successfully to $TARGET_DIR/DevprgProgrammer.elf"
          else
            echo "❌ Copy failed! Checking directory:"
            ls -la "$TARGET_DIR" || echo "Directory not accessible"
            exit 1
          fi

          # 5. 同时复制到所有其他子目录（以防万一）
          find "$LOADER_DIR" -type d | while read -r dir; do
            cp "$ELF" "$dir/DevprgProgrammer.elf" 2>/dev/null || true
            cp "$ELF" "$dir/DevprgProgrammer1.elf" 2>/dev/null || true
            cp "$ELF" "$dir/DevprgProgrammer2.elf" 2>/dev/null || true
          done

          # 6. 验证目标文件是否存在
          echo "===== Final verification ====="
          ls -la "$LOADER_DIR/ڡ���_MEIZU/ڡ���16XS/"

      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: EdlFlash-release
          path: android/app/build/outputs/apk/release/*.apk
