name: Build APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download EDL assets
        run: |
          mkdir -p edl_flash_app/src/main
          curl -L --fail \
            -o edl_assets.tar.gz \
            https://github.com/wuyifeiwu4-dot/EdlFlash/releases/download/v1.0-assets/edl_assets.tar.gz
          tar -xzf edl_assets.tar.gz
          echo "当前目录内容："
          ls -la
          echo "查找 assets 目录："
          ASSETS_DIR=$(find . -maxdepth 3 -type d -name assets | head -n 1)
          if [ -z "$ASSETS_DIR" ]; then
            echo "❌ 找不到 assets 目录"
            echo "全部目录树："
            find . -type d
            exit 1
          fi
          echo "✅ 找到 assets 目录：$ASSETS_DIR"
          mv "$ASSETS_DIR" edl_flash_app/src/main/assets
          # 删除可能引起重复的 dexopt 文件夹
          rm -rf edl_flash_app/src/main/assets/dexopt
          echo "✅ assets 已移动，并清理了 dexopt"
          ls -la edl_flash_app/src/main/assets

      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: EdlFlash-release
          path: android/app/build/outputs/apk/release/*.apk
