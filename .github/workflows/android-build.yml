name: Build APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download EDL assets
        run: |
          mkdir -p edl_flash_app/src/main
          curl -L --fail \
            -o edl_assets.tar.gz \
            https://github.com/wuyifeiwu4-dot/EdlFlash/releases/download/v1.0-assets/edl_assets.tar.gz
          tar -xzf edl_assets.tar.gz
          mv assets edl_flash_app/src/main/assets
          echo "EDL assets installed"
          ls -la edl_flash_app/src/main/assets

      # ========== 核心修复：动态定位 16XS 目录并复制 ELF ==========
      - name: Fix missing ELF in 16XS directory
        run: |
          set -e
          ASSETS_DIR="edl_flash_app/src/main/assets"
          LOADER_DIR="$ASSETS_DIR/loader_builtin"

          # 1. 找到任意 DevprgProgrammer*.elf
          ELF=$(find "$ASSETS_DIR" -type f -name "DevprgProgrammer*.elf" -print -quit)
          if [ -z "$ELF" ]; then
            echo "❌ No DevprgProgrammer*.elf found in assets!"
            exit 1
          fi
          echo "✅ Found ELF: $ELF"

          # 2. 查找包含 "16XS" 的目录（不依赖具体乱码）
          TARGET_DIR=$(find "$LOADER_DIR" -type d -name "*16XS*" -print -quit)
          if [ -z "$TARGET_DIR" ]; then
            echo "❌ Cannot find directory containing '16XS' under loader_builtin."
            echo "All subdirectories:"
            find "$LOADER_DIR" -type d
            exit 1
          fi
          echo "✅ Found target directory: $TARGET_DIR"

          # 3. 复制 ELF 到目标目录（三种命名）
          cp -v "$ELF" "$TARGET_DIR/DevprgProgrammer.elf"
          cp -v "$ELF" "$TARGET_DIR/DevprgProgrammer1.elf"
          cp -v "$ELF" "$TARGET_DIR/DevprgProgrammer2.elf"

          # 4. 验证文件是否存在
          if [ -f "$TARGET_DIR/DevprgProgrammer.elf" ]; then
            echo "✅ Verification passed: $TARGET_DIR/DevprgProgrammer.elf exists."
          else
            echo "❌ Verification failed: file not found."
            exit 1
          fi

          # 5. 额外：也复制到所有子目录（防万一）
          find "$LOADER_DIR" -type d | while read -r dir; do
            cp -n "$ELF" "$dir/DevprgProgrammer.elf" 2>/dev/null || true
            cp -n "$ELF" "$dir/DevprgProgrammer1.elf" 2>/dev/null || true
            cp -n "$ELF" "$dir/DevprgProgrammer2.elf" 2>/dev/null || true
          done
          echo "✅ Also copied to all subdirectories."

      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: EdlFlash-release
          path: android/app/build/outputs/apk/release/*.apk
