name: Build APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download EDL assets
        run: |
          mkdir -p edl_flash_app/src/main
          curl -L --fail \
            -o edl_assets.tar.gz \
            https://github.com/wuyifeiwu4-dot/EdlFlash/releases/download/v1.0-assets/edl_assets.tar.gz
          tar -xzf edl_assets.tar.gz
          mv assets edl_flash_app/src/main/assets
          echo "EDL assets installed:"
          du -sh edl_flash_app/src/main/assets
          ls -lah edl_flash_app/src/main/assets

      # ========== 新增：修复乱码路径 ==========
      - name: Fix broken asset path encoding
        run: |
          # 查找真实的 DevprgProgrammer.elf（不管它在哪个乱码文件夹里）
          REAL_ELF=$(find edl_flash_app/src/main/assets -name "DevprgProgrammer.elf" -print -quit)
          if [ -z "$REAL_ELF" ]; then
            echo "ERROR: DevprgProgrammer.elf not found anywhere!"
            exit 1
          fi
          echo "Found at: $REAL_ELF"

          # 创建 Gradle 期望的精确路径（直接从报错中复制）
          TARGET_DIR="edl_flash_app/src/main/assets/loader_builtin/ڡ���_MEIZU/ڡ���16XS"
          mkdir -p "$TARGET_DIR"

          # 复制文件到目标位置
          cp "$REAL_ELF" "$TARGET_DIR/"
          echo "✅ Copied to: $TARGET_DIR/DevprgProgrammer.elf"

      - name: Verify fixed assets
        run: |
          if [ -f "edl_flash_app/src/main/assets/loader_builtin/ڡ���_MEIZU/ڡ���16XS/DevprgProgrammer.elf" ]; then
            echo "✅ Verification passed – file is in the correct place."
          else
            echo "❌ Verification failed – file still missing in expected path."
            exit 1
          fi
      # ========== 新增结束 ==========

      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: EdlFlash-release
          path: android/app/build/outputs/apk/release/*.apk
